<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulare</title></head>
<body>
<!-- Nur für Netlify Forms: Netlify erkennt Formulare beim Veröffentlichen nur in fertigen HTML-Dateien.
     Formulare auf serverseitig erzeugten Seiten (z. B. Inserat-Detailseite) werden hier angemeldet.
     Felder müssen mit dem echten Formular übereinstimmen. -->
<form name="besichtigung" data-netlify="true" netlify-honeypot="bot-feld" hidden>
  <input name="inserat_id"><input name="inserat_titel"><input name="inserat_link">
  <input name="vorname"><input name="email"><input name="telefon">
  <textarea name="wunschtermin"></textarea><textarea name="nachricht"></textarea>
  <input name="quelle"><input name="bot-feld">
</form>
</body></html>
